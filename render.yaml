services:
  - type: web
    name: industro-plumbers
    runtime: ruby
    plan: free
    healthCheckPath: /up
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: RAILS_LOG_LEVEL
        value: info
      - key: AIVEN_DATABASE_URL
        sync: false
      # Manually managed on purpose. This used to be fromDatabase, which pinned
      # it to Render's own Postgres - re-applying the blueprint would then have
      # silently pointed the app back at that database instead of Supabase.
      # Set it to the Supabase connection string in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: APP_HOST
        value: industro-plumbers.onrender.com
      - key: MAILER_SENDER
        value: noreply@industro-plumbers.onrender.com
      - key: SMTP_ADDRESS
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_DOMAIN
        value: industro-plumbers.onrender.com
      - key: SMTP_USERNAME
        value: apikey
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: industro-plumbers-db
    plan: 0.1c-256mb
    databaseName: industro_plumbers_production
