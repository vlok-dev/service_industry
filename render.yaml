services:
  - type: web
    name: industro-plumbers
    runtime: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate && bundle exec rails db:seed
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: RAILS_LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: industro-plumbers-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: industro-plumbers-db
          property: host
      - key: DB_USERNAME
        fromDatabase:
          name: industro-plumbers-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: industro-plumbers-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: industro-plumbers-db
          property: database

databases:
  - name: industro-plumbers-db
    plan: free
    databaseName: industro_plumbers_production